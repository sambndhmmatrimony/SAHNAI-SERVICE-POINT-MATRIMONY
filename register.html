<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registration - SAHNAI MATRIMONY</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo">💍 SAHNAI MATRIMONY</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="register.html">Registration</a>
    <a href="login.html">Login</a>
  </nav>
</header>


<main class="container">

  <div class="card">

    <h1>Create Free Account</h1>

    <p class="subtitle">
      अपना Matrimonial Profile बनाने के लिए Registration करें
    </p>


    <form id="registerForm">

      <h2>👤 Basic Details</h2>

      <label>पूरा नाम</label>
      <input
        type="text"
        id="full_name"
        placeholder="पूरा नाम लिखें"
        required
      >

      <label>मोबाइल नंबर</label>
      <input
        type="tel"
        id="mobile"
        placeholder="मोबाइल नंबर"
        required
      >

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Gender चुनें</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>


      <label>जन्म तारीख</label>
      <input type="date" id="date_of_birth">


      <label>उम्र</label>
      <input
        type="number"
        id="age"
        placeholder="उम्र"
      >


      <label>Marital Status</label>
      <select id="marital_status">
        <option value="">चुनें</option>
        <option value="Never Married">Never Married</option>
        <option value="Divorced">Divorced</option>
        <option value="Widowed">Widowed</option>
        <option value="Separated">Separated</option>
      </select>


      <h2>🛕 Religion & Community</h2>

      <label>Religion</label>
      <input
        type="text"
        id="religion"
        placeholder="धर्म"
      >

      <label>Community / Caste</label>
      <input
        type="text"
        id="caste"
        placeholder="जाति / Community"
      >

      <label>Mother Tongue</label>
      <input
        type="text"
        id="mother_tongue"
        placeholder="मातृभाषा"
      >


      <h2>📍 Location</h2>

      <label>City</label>
      <input
        type="text"
        id="city"
        placeholder="शहर"
      >

      <label>State</label>
      <input
        type="text"
        id="state"
        placeholder="राज्य"
      >


      <h2>🎓 Education & Career</h2>

      <label>Education</label>
      <input
        type="text"
        id="education"
        placeholder="शिक्षा"
      >

      <label>Occupation</label>
      <input
        type="text"
        id="occupation"
        placeholder="व्यवसाय"
      >

      <label>Company / Business</label>
      <input
        type="text"
        id="company"
        placeholder="Company / Business"
      >

      <label>Income</label>
      <input
        type="text"
        id="income"
        placeholder="आय"
      >


      <h2>👨‍👩‍👧‍👦 Family Details</h2>

      <label>Father Name</label>
      <input
        type="text"
        id="father_name"
        placeholder="पिता का नाम"
      >

      <label>Mother Name</label>
      <input
        type="text"
        id="mother_name"
        placeholder="माता का नाम"
      >

      <label>Siblings</label>
      <input
        type="text"
        id="siblings"
        placeholder="भाई / बहन की जानकारी"
      >


      <h2>📝 About Me</h2>

      <textarea
        id="about"
        rows="5"
        placeholder="अपने बारे में लिखें"
      ></textarea>


      <label>छोटा परिचय</label>

      <textarea
        id="bio"
        rows="4"
        placeholder="अपना छोटा परिचय लिखें"
      ></textarea>


      <h2>❤️ Partner Preference</h2>

      <label>Partner की न्यूनतम उम्र</label>
      <input
        type="number"
        id="partner_age_min"
        placeholder="जैसे 21"
      >

      <label>Partner की अधिकतम उम्र</label>
      <input
        type="number"
        id="partner_age_max"
        placeholder="जैसे 30"
      >

      <label>Partner Education</label>
      <input
        type="text"
        id="partner_education"
        placeholder="Partner की Education"
      >

      <label>Partner Occupation</label>
      <input
        type="text"
        id="partner_occupation"
        placeholder="Partner का Occupation"
      >

      <label>Partner City</label>
      <input
        type="text"
        id="partner_city"
        placeholder="Partner का पसंदीदा शहर"
      >


      <h2>🔐 Account Details</h2>

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="अपना Email डालें"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password बनाएं"
        required
      >


      <label class="terms">
        <input type="checkbox" id="terms" required>
        मैंने Terms & Privacy Policy स्वीकार की है।
      </label>


      <button type="submit" class="primary">
        📝 REGISTER NOW
      </button>

      <div id="message"></div>

    </form>

  </div>

</main>


<footer>
  © 2026 SAHNAI MATRIMONY
</footer>


<script src="app.js"></script>

</body>
</html>
