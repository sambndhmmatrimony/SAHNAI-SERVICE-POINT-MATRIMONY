<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - SAHNAI MATRIMONY</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div class="logo">
      💍 SAHNAI MATRIMONY
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="register.html">Registration</a>
      <a href="login.html">Login</a>
    </nav>

  </header>


  <main class="about">

    <h1>🔐 Login</h1>

    <div class="feature-card">

      <h2>अपने Account में Login करें</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="अपना Email डालें"
        required
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="अपना Password डालें"
        required
      >

      <button
        type="button"
        onclick="loginUser()"
        class="primary"
      >
        🔐 Login
      </button>

      <p>
        Account नहीं है?
        <a href="register.html">Registration करें</a>
      </p>

      <div id="loginMessage"></div>

    </div>

  </main>


  <footer>
    <p>© 2026 SAHNAI SERVICE POINT MATRIMONY</p>
  </footer>


  <script src="app.js"></script>

</body>

</html>
